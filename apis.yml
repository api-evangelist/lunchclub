aid: lunchclub
name: Lunchclub
description: >-
  Lunchclub is an AI-powered professional networking platform that matches members for
  one-to-one meetings and warm introductions based on their goals, background, and interests.
  Members set what they are looking for — hiring, fundraising, sales, mentorship, or making new
  connections — and Lunchclub's matching system proposes relevant people to meet over video.
  The company is consumer/prosumer facing and does not publish a public developer API, developer
  portal, or machine-readable API specification. This profile was surfaced as a portfolio company
  of Lightspeed Venture Partners and enriched in the API Evangelist network; probing confirmed no
  public API surface, no OpenAPI, and no /.well-known discovery documents.
